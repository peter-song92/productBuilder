<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Tip Calculator</title>
  <meta name="google-adsense-account" content="ca-pub-7400828490927114">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7400828490927114"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css"/>
</head>

<body>
  <div class="page">
    <header class="hero">
      <div>
        <h1><span class="brand">QuickTip</span><span class="title-sub">Tip smarter</span></h1>
      </div>
    </header>

    <main>
      <section class="card panel">
        <div class="panel-head">
          <h2>Bill + Tip board</h2>
          <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
        </div>

        <div class="panel-grid">
          <div>
            <div class="block">
              <label for="amount">Bill amount ($)</label>
              <input
                id="amount"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="Enter amount"
                autocorrect="off"
                autocomplete="off"
                autocapitalize="off"
              />
            </div>

            <div class="block">
              <label>Amount type</label>
              <div class="toggle" role="group" aria-label="Amount type">
                <button id="beforeBtn" class="active" aria-pressed="true" type="button">Before Tax</button>
                <button id="afterBtn" aria-pressed="false" type="button">After Tax</button>
              </div>
              <div class="hint">After-tax reverses tax to find pre-tax.</div>
            </div>

            <div class="block row">
              <div class="col">
                <label for="city">Location</label>
                <select id="city">
                  <option value="NYC" data-tax="8.875">New York City</option>
                  <option value="BROOKLYN" data-tax="8.875">Brooklyn (Kings County)</option>
                  <option value="HACKENSACK" data-tax="6.625">Hackensack, NJ (Bergen)</option>
                  <option value="FORTLEE" data-tax="6.625">Fort Lee, NJ (Bergen)</option>
                  <option value="PARAMUS" data-tax="6.625">Paramus, NJ (Bergen)</option>
                  <option value="RIDGEWOOD" data-tax="6.625">Ridgewood, NJ (Bergen)</option>
                  <option value="ENGLEWOOD" data-tax="6.625">Englewood, NJ (Bergen)</option>
                  <option value="TEANECK" data-tax="6.625">Teaneck, NJ (Bergen)</option>
                  <option value="CUSTOM">Custom</option>
                </select>
              </div>
              <div class="col">
                <label for="tax">Tax rate (%)</label>
                <input
                  id="tax"
                  type="number"
                  inputmode="decimal"
                  min="0"
                  step="0.001"
                  value="8.875"
                  autocorrect="off"
                  autocomplete="off"
                  autocapitalize="off"
                />
                <div class="taxNote" id="taxNote">NYC tax rate: 8.875%</div>
              </div>
            </div>

            <div class="block">
              <label for="customTip">Custom tip (%)</label>
              <input
                id="customTip"
                type="number"
                inputmode="decimal"
                min="0"
                step="0.01"
                placeholder="Optional"
                autocorrect="off"
                autocomplete="off"
                autocapitalize="off"
              />
            </div>

            <div class="error" id="error" role="alert" aria-live="polite"></div>
          </div>

          <div>
            <div class="tip-grid" id="tipGrid"></div>

            <div class="summary">
              <div class="summary-row">
                <span>Subtotal (pre-tax)</span>
                <strong id="subtotal">—</strong>
              </div>
              <div class="summary-row">
                <span>Tax</span>
                <strong id="taxAmount">—</strong>
              </div>
              <div class="summary-row">
                <span>Selected tip</span>
                <strong id="tipAmount">—</strong>
              </div>
              <div class="summary-total">
                <span>Total</span>
                <strong id="grandTotal">—</strong>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      Built with care · TipForge
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
